{% extends "base.html" %}
{% block title %}Connexion — Centre Al-Bir{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-ivory pt-20 pb-12 px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8" data-aos="fade-down">
      <div class="w-16 h-16 bg-primary-900 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl">
        <span class="text-3xl">🔐</span>
      </div>
      <h1 class="font-serif text-2xl font-bold text-primary-900">Espace Personnel</h1>
      <p class="text-gray-500 text-sm mt-1">Centre Al-Bir — Accès sécurisé</p>
    </div>

    <!-- Carte connexion -->
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8" data-aos="fade-up">
      <form method="POST" action="{{ url_for('auth.connexion') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Adresse email</label>
          <input type="email" name="email" required placeholder="votre@email.com"
                 class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary-500 focus:outline-none transition-colors text-gray-800 bg-gray-50 focus:bg-white" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
          <div class="relative">
            <input type="password" name="password" id="pwd" required placeholder="••••••••"
                   class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary-500 focus:outline-none transition-colors text-gray-800 bg-gray-50 focus:bg-white pr-12" />
            <button type="button" onclick="togglePwd()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" name="remember" id="remember"
                 class="w-4 h-4 rounded border-gray-300 text-primary-700 focus:ring-primary-500" />
          <label for="remember" class="text-sm text-gray-600 cursor-pointer">Se souvenir de moi</label>
        </div>

        <button type="submit"
                class="w-full py-4 bg-primary-900 hover:bg-primary-800 text-white font-bold rounded-2xl transition-all duration-300 hover:scale-105 shadow-lg text-sm">
          Se connecter →
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-100 text-center">
        <a href="{{ url_for('public.accueil') }}"
           class="text-sm text-gray-500 hover:text-primary-700 transition-colors">
          ← Retour au site
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
  function togglePwd() {
    const pwd = document.getElementById('pwd');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }
</script>
{% endblock %}
