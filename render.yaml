services:
  - type: web
    name: centre-albir
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: albir-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: centrealbir96@gmail.com
      - key: ADMIN_PASSWORD
        value: 6410
      - key: ADMIN_NAME
        value: Cheikh Mohamed Souleimane

databases:
  - name: albir-db
    databaseName: albir
    user: albir_user
    plan: free
    region: frankfurt
