services:
  - type: web
    name: centre-albir
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: albir-db
          property: connectionString

databases:
  - name: albir-db
    databaseName: albir
    user: albir_user
    plan: free
